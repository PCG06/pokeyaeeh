name: CI

on:
  push:
    branches:
      - YAEEH

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
      UNUSED_ERROR: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          path: agbcc
          repository: pret/agbcc

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y build-essential libpng-dev libelf-dev libgtk-3-dev jq curl zip

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: agbcc

      - name: ROM
        run: make -j$(nproc) -O all

      - name: Send failure notification to Discord
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"embeds\": [
                   {
                     \"title\": \"CI Job Failed\",
                     \"description\": \"A CI job has failed.\",
                     \"color\": 16711680,
                     \"fields\": [
                       {
                         \"name\": \"Commit hash:\",
                         \"value\": \"${{ github.event.head_commit.id }}\",
                         \"inline\": false
                       },
                       {
                         \"name\": \"Committed by:\",
                         \"value\": \"[${{ github.actor }}](https://github.com/${{ github.actor }})\",
                         \"inline\": false
                       },
                       {
                         \"name\": \"Workflow run:\",
                         \"value\": \"[View workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\",
                         \"inline\": false
                       }
                     ]
                   }
                 ]
               }" \
               ${{ secrets.DISCORD_BUILD_SECRET }}

      - name: Download pokeemerald
        run: git clone https://github.com/pret/pokeemerald
        working-directory: tools

      - name: Install agbcc to pokeemerald
        run: cp -r agbcc pokeemerald/tools/
        working-directory: tools

      - name: Build pokeemerald
        run: make -j8
        working-directory: tools/pokeemerald

      - name: Create and zip patch
        shell: bash
        run: |
          chmod -R 755 ./tools/flips-linux
          COMMIT_HASH="${GITHUB_SHA:0:7}"
          PATCH_NAME="pokeyaeeh_${COMMIT_HASH}.bps"
          cp tools/flips-linux tools/flips
          ./tools/flips --create tools/pokeemerald/pokeemerald.gba pokeyaeeh.gba "$PATCH_NAME"
          zip -j Pokemon_YAEEH.zip "$PATCH_NAME"
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV

      - name: Upload to Pixeldrain
        id: upload
        run: |
          echo "Uploading Pokemon_YAEEH.zip to Pixeldrain..."
          RESPONSE=$(curl -s -u user:${{ secrets.PXDRAN_API }} -F "file=@Pokemon_YAEEH.zip" https://pixeldrain.com/api/file)
          echo "$RESPONSE" | jq .
          DOWNLOAD_ID=$(echo "$RESPONSE" | jq -r '.id')
          DOWNLOAD_URL="https://pixeldrain.com/api/file/${DOWNLOAD_ID}?download"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      - name: Send patch notification to Discord
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"embeds\": [
                   {
                     \"title\": \"Patch created!\",
                     \"color\": 65280,
                     \"fields\": [
                       {
                         \"name\": \"Download:\",
                         \"value\": \"[__**Click here**__](${{ env.DOWNLOAD_URL }})\",
                         \"inline\": false
                       },
                       {
                         \"name\": \"Commit hash:\",
                         \"value\": \"[\`${{ env.COMMIT_HASH }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\",
                         \"inline\": false
                       }
                     ]
                   }
                 ]
               }" \
               ${{ secrets.DISCORD_PATCH_SECRET }}
